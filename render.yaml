services:
  - type: web
    name: vms-ds
    env: python
    region: oregon
    plan: free

    python:
      version: 3.13.12

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput

    startCommand: |
      python manage.py migrate &&
      python manage.py seed_demo_data &&
      gunicorn vms_ds.wsgi:application \
        --bind 0.0.0.0:${PORT:-10000} \
        --workers 1 \
        --access-logfile - \
        --error-logfile -

    autoDeploy: true
